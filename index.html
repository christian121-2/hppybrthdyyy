<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#feecea">
  <meta name="description" content="A little birthday surprise for Okta">
  <title>Happy Birthday, Okta!</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    /* Small fixes for the restored layout and the letter dialog. */
    html, body { min-height: 100%; }
    body { min-height: 100vh; min-height: 100svh; }
    #wrapper { min-height: 100vh; min-height: 100svh; height: auto; overflow: hidden; }
    .content { min-height: 75vh; align-items: center; }
    .left .btn { transform: none; animation: none; }
    .box__letter[hidden], .letter__border[hidden] { display: none !important; }
    .box__letter.is-open { display: block; }
    .box__letter.is-open .letter__border { display: block; }
    .box__letter { overflow-y: auto; padding: 18px 0; }
    .box__letter .letter__border { max-height: calc(100vh - 36px); max-height: calc(100svh - 36px); overflow: auto; }
    .letter__border .letter { min-height: 100%; }
    .letter__border .close { border: 0; z-index: 6; font-size: 1rem; }
    #btn__letter:focus-visible, .letter__border .close:focus-visible { outline: 3px solid #333; outline-offset: 4px; }
    .content__letter .right .text__letter { white-space: pre-line; }
    @media (max-width: 658px) {
      #wrapper { overflow-x: hidden; overflow-y: auto; }
      .content { min-height: 0; padding-bottom: 48px; }
      .content .left, .content .right { width: 100%; padding-left: 0; }
      .content .right .image { width: min(72vw, 320px); height: min(72vw, 320px); }
      .box__letter .letter__border { height: min(520px, calc(100svh - 36px)); }
      .letter__border .letter .content__letter { min-height: 390px; }
      .content__letter .left { padding: .6rem; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; scroll-behavior: auto !important; }
    }
  </style>
</head>
<body>
  <audio id="background-music" loop preload="none" playsinline>
    <source src="satokin-happy-birthday-ukulele-600716.mp3" type="audio/mpeg">
    Your browser does not support audio playback.
  </audio>

  <main id="wrapper">
    <div class="flag__birthday" aria-hidden="true">
      <img class="flag__left" src="1.png" alt="" width="350">
      <img class="flag__right" src="1.png" alt="" width="350">
    </div>

    <section class="content" aria-label="Birthday celebration">
      <div class="left">
        <div class="title">
          <h1 class="happy" aria-label="Happy">
            <span style="--t: 4s">H</span><span style="--t: 4.2s">a</span><span style="--t: 4.4s">p</span><span style="--t: 4.6s">p</span><span style="--t: 4.8s">y</span>
          </h1>
          <h1 class="birthday" aria-label="Birthday">
            <span style="--t: 5s">B</span><span style="--t: 5.2s">i</span><span style="--t: 5.4s">r</span><span style="--t: 5.6s">t</span><span style="--t: 5.8s">h</span><span style="--t: 6s">d</span><span style="--t: 6.2s">a</span><span style="--t: 6.4s">y</span>
          </h1>
          <div class="hat"><img src="hat.png" alt="Party hat" width="130"></div>
        </div>
        <div class="date__of__birth"><span></span></div>
        <div class="btn">
          <button id="btn__letter" type="button" aria-haspopup="dialog" aria-controls="birthday-letter">
            Open your letter <i class="fa-regular fa-envelope" aria-hidden="true"></i>
          </button>
        </div>
      </div>

      <div class="right">
        <div class="box__account">
          <div class="image"><img src="img.png" alt="A cute birthday bear"></div>
          <div class="name"><i class="fa-solid fa-heart" aria-hidden="true"></i><span>Okta</span><i class="fa-solid fa-heart" aria-hidden="true"></i></div>
          <div class="balloon_one" aria-hidden="true"><img width="100" src="balloon1.png" alt=""></div>
          <div class="balloon_two" aria-hidden="true"><img width="100" src="balloon2.png" alt=""></div>
        </div>
        <div class="cricle" aria-hidden="true">
          <div class="text__cricle">
            <span style="--i: 1">h</span><span style="--i: 2">a</span><span style="--i: 3">p</span><span style="--i: 4">p</span><span style="--i: 5">y</span><span style="--i: 6"> </span><span style="--i: 7">b</span><span style="--i: 8">i</span><span style="--i: 9">r</span><span style="--i: 10">t</span><span style="--i: 11">h</span><span style="--i: 12">d</span><span style="--i: 13">a</span><span style="--i: 14">y</span><span style="--i: 15"> </span>
          </div>
          <i class="fa-solid fa-heart" aria-hidden="true"></i>
        </div>
      </div>
    </section>

    <div class="decorate_star star1" style="--t: 15s" aria-hidden="true"></div>
    <div class="decorate_star star2" style="--t: 15.2s" aria-hidden="true"></div>
    <div class="decorate_star star3" style="--t: 15.4s" aria-hidden="true"></div>
    <div class="decorate_star star4" style="--t: 15.6s" aria-hidden="true"></div>
    <div class="decorate_star star5" style="--t: 15.8s" aria-hidden="true"></div>
    <div class="decorate_flower--one" style="--t: 15s" aria-hidden="true"><img width="30" src="decorate_flower.png" alt=""></div>
    <div class="decorate_flower--two" style="--t: 15.3s" aria-hidden="true"><img width="30" src="decorate_flower.png" alt=""></div>
    <div class="decorate_flower--three" style="--t: 15.6s" aria-hidden="true"><img width="30" src="decorate_flower.png" alt=""></div>
    <div class="decorate_bottom" aria-hidden="true"><img src="decorate.png" alt="" width="100"></div>
    <div class="smiley__icon" aria-hidden="true"><img src="smiley_icon.png" alt="" width="80"></div>

    <div class="box__letter" id="birthday-letter" role="dialog" aria-modal="true" aria-labelledby="letter-title" hidden>
      <div class="letter__border">
        <article class="letter">
          <h2 class="title__letter" id="letter-title">To you <i class="fa-solid fa-heart" aria-hidden="true"></i></h2>
          <div class="content__letter">
            <div class="left">
              <img id="heart__letter" src="heart_letter.png" alt="A heart for you">
              <img class="heart heart_1" style="--t: .2s" width="20" src="heart.png" alt="">
              <img class="heart heart_2" style="--t: .4s" width="20" src="heart.png" alt="">
              <img class="heart heart_3" style="--t: .6s" width="20" src="heart.png" alt="">
              <img class="heart heart_4" style="--t: .8s" width="20" src="heart.png" alt="">
            </div>
            <div class="right">
              <div class="love__img"><img src="love.png" alt="" width="100"></div>
              <div class="text__letter"><p></p></div>
              <img id="mewmew" width="80" src="mewmew.gif" alt="A little birthday cat">
            </div>
          </div>
        </article>
        <button class="close" type="button" aria-label="Close birthday letter"><i class="fa-solid fa-xmark" aria-hidden="true"></i></button>
      </div>
    </div>
  </main>

  <script>
    (() => {
      const music = document.getElementById('background-music');
      const modal = document.getElementById('birthday-letter');
      const openButton = document.getElementById('btn__letter');
      const closeButton = modal.querySelector('.close');
      const dateElement = document.querySelector('.date__of__birth span');
      const titleElement = document.querySelector('.title__letter');
      const messageElement = document.querySelector('.text__letter p');
      const dateText = '21 November 2026';
      const letterText = 'You are a very special girl. Today, as you turn 17, I wish you all the best, good health, boundless happiness, and a wonderful future. May you grow into a mature, kind-hearted and wise young woman. Happy birthday, Okta!';
      let previousFocus = null;
      let typingTimers = [];

      // Browsers require a user gesture before playing audio; try on load and retry on first interaction.
      const tryPlayMusic = () => {
        if (music.paused) music.play().catch(() => {});
      };
      window.addEventListener('load', tryPlayMusic, { once: true });
      ['pointerdown', 'keydown', 'touchstart'].forEach((eventName) => {
        window.addEventListener(eventName, tryPlayMusic, { once: true, passive: true });
      });

      let dateIndex = 0;
      const dateTimer = window.setInterval(() => {
        if (dateIndex < dateText.length) {
          dateElement.append(dateText[dateIndex++]);
        } else {
          window.clearInterval(dateTimer);
          dateElement.parentElement.insertAdjacentText('beforeend', ' 🎂 ');
        }
      }, 100);

      function clearTyping() {
        typingTimers.forEach(window.clearInterval);
        typingTimers = [];
      }

      function openLetter() {
        previousFocus = document.activeElement;
        modal.hidden = false;
        modal.classList.add('is-open');
        document.body.style.overflow = 'hidden';
        closeButton.focus();
        clearTyping();
        titleElement.textContent = '';
        messageElement.textContent = '';
        const title = 'To you';
        let titleIndex = 0;
        const titleTimer = window.setInterval(() => {
          titleElement.append(title[titleIndex++]);
          if (titleIndex >= title.length) {
            window.clearInterval(titleTimer);
            const heart = document.createElement('i');
            heart.className = 'fa-solid fa-heart';
            heart.setAttribute('aria-hidden', 'true');
            titleElement.append(' ', heart);
          }
        }, 100);
        typingTimers.push(titleTimer);

        window.setTimeout(() => {
          document.getElementById('heart__letter').classList.add('animationOp');
          modal.querySelector('.love__img').classList.add('animationOp');
          document.getElementById('mewmew').classList.add('animationOp');
          modal.querySelectorAll('.heart').forEach((heart) => heart.classList.add('animation'));
        }, 300);
        let letterIndex = 0;
        const letterTimer = window.setInterval(() => {
          messageElement.append(letterText[letterIndex++]);
          if (letterIndex >= letterText.length) window.clearInterval(letterTimer);
        }, 35);
        typingTimers.push(letterTimer);
      }

      function closeLetter() {
        clearTyping();
        modal.classList.remove('is-open');
        modal.hidden = true;
        document.body.style.overflow = '';
        titleElement.innerHTML = 'To you <i class="fa-solid fa-heart" aria-hidden="true"></i>';
        messageElement.textContent = '';
        modal.querySelectorAll('.animation, .animationOp').forEach((element) => {
          element.classList.remove('animation', 'animationOp');
        });
        if (previousFocus) previousFocus.focus();
      }

      openButton.addEventListener('click', openLetter);
      closeButton.addEventListener('click', closeLetter);
      modal.addEventListener('click', (event) => {
        if (event.target === modal) closeLetter();
      });
      document.addEventListener('keydown', (event) => {
        if (event.key === 'Escape' && !modal.hidden) closeLetter();
        if (event.key === 'Tab' && !modal.hidden) {
          const focusable = [closeButton];
          if (event.shiftKey && document.activeElement === focusable[0]) {
            event.preventDefault();
            focusable[focusable.length - 1].focus();
          }
        }
      });
    })();
  </script>
</body>
</html>
