<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Birthday Gift Animation</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
</head>
<body>
  <audio id="background-music" loop preload="auto" playsinline>
    <source src="satokin-happy-birthday-ukulele-600716.mp3" type="audio/mpeg">
    Browser Anda tidak mendukung pemutar audio.
  </audio>

  <div id="wrapper">
    <!-- Existing page content starts here -->
  </div>

  <script>
    const backgroundMusic = document.getElementById("background-music");

    async function playMusic() {
      try {
        await backgroundMusic.play();
      } catch (error) {
        // Browsers may block autoplay until the first user interaction.
      }
    }

    window.addEventListener("load", playMusic);

    // Starts immediately after the first interaction if autoplay was blocked.
    ["pointerdown", "touchstart", "keydown"].forEach((eventName) => {
      window.addEventListener(eventName, playMusic, { once: true, passive: true });
    });
  </script>
</body>
</html>
